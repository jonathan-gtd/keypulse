name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$VERSION" -o dist/keypulse.exe ./cmd/keypulse

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\keypulse.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assets
        shell: bash
        run: |
          cd dist
          cp keypulse.exe "keypulse-$VERSION-windows-amd64.exe"
          sha256sum "keypulse-$VERSION-setup.exe" "keypulse-$VERSION-windows-amd64.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
            "dist/keypulse-$VERSION-setup.exe" "dist/keypulse-$VERSION-windows-amd64.exe" dist/SHA256SUMS.txt
